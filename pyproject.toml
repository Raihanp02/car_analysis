[project]
name = "pakuwon-env"
version = "0.1.0"
description = "runs all case vehicle and plate"
requires-python = ">=3.11"
readme = "../README.md"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "torch==2.6.0+cu126",
    "torchvision==0.21.0+cu126",
    "ultralytics>=8.3.0",
    "paddleocr==2.10.0",
    "paddlepaddle==3.0.0",
    "onnxruntime>=1.28.0",
    "cvzone>=2.0.0",
    "supervision>=0.29.1",
    "fast-plate-ocr[onnx-gpu]>=1.1.0",
    "transformers>=5.14.1",
]

[project.scripts]
pakuwon = "pakuwon.main:main"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[tool.setuptools.packages.find]
include = ["pakuwon*"]
